<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Grimoire VTT — Modern Virtual Tabletop</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            grim: {
              900: '#0a0b0e',
              800: '#12141a',
              700: '#1a1d26',
              600: '#282c3a',
              500: '#3f455a',
              400: '#646c8a',
              accent: '#8b5cf6', // Arcane Violet
              gold: '#f59e0b',   // Runic Gold
              danger: '#ef4444',
              success: '#10b981'
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'monospace'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Three.js for 3D Animated Dice Simulation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- PeerJS for P2P WebRTC Multiplayer -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* Custom Scrollbars & Reset */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a0b0e; }
    ::-webkit-scrollbar-thumb { background: #282c3a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f455a; }
    body { user-select: none; -webkit-user-select: none; overflow: hidden; background-color: #0a0b0e; color: #e2e8f0; }
    canvas { touch-action: none; }
    .glass-panel { background: rgba(18, 20, 26, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-button { background: rgba(40, 44, 58, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.15s ease; cursor: pointer; }
    .glass-button:hover { background: rgba(139, 92, 246, 0.25); border-color: rgba(139, 92, 246, 0.5); }
    .glass-button.active { background: rgba(139, 92, 246, 0.4); border-color: #8b5cf6; color: #fff; }
  </style>
</head>
<body class="font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // --- INITIAL MOCK DATA ---
    const DEFAULT_MAP = "https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1600&auto=format&fit=crop";
    const INITIAL_SAMPLE_TOKENS = [
      { id: 't1', name: 'Valerius (Paladin)', img: 'https://images.unsplash.com/photo-1568602471122-7832951cc4c5?w=150&auto=format&fit=crop&q=80', size: 60, hp: 28, maxHp: 32 },
      { id: 't2', name: 'Lyra (Mage)', img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80', size: 60, hp: 18, maxHp: 18 },
      { id: 't3', name: 'Goblin Boss', img: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=150&auto=format&fit=crop&q=80', size: 70, hp: 45, maxHp: 45 }
    ];

    const DEFAULT_SCENES = [
      { id: 'scene-1', name: 'Crypt Entrance', mapUrl: DEFAULT_MAP, tokens: [], drawings: [], fogShapes: [], gridScale: 50 },
      { id: 'scene-2', name: 'Tavern Brawl', mapUrl: 'https://images.unsplash.com/photo-1514933651103-005eec06c04b?q=80&w=1600&auto=format&fit=crop', tokens: [], drawings: [], fogShapes: [], gridScale: 50 }
    ];

    // --- UTILITY FUNCTIONS ---
    const generateId = () => Math.random().toString(36).substring(2, 9);
    
    // Simple Dice Roller Engine (e.g. 1d20+5, 2d6+3)
    const rollDiceFormula = (formula) => {
      try {
        const clean = formula.replace(/\s+/g, '').toLowerCase();
        const regex = /^(\d+)d(\d+)([\+\-]\d+)?$/;
        const match = clean.match(regex);
        if (!match) {
          const simpleVal = parseInt(clean, 10);
          if (!isNaN(simpleVal)) return { total: simpleVal, rolls: [simpleVal], formula };
          throw new Error('Invalid syntax');
        }
        const count = parseInt(match[1], 10);
        const sides = parseInt(match[2], 10);
        const modifier = match[3] ? parseInt(match[3], 10) : 0;
        
        let rolls = [];
        let sum = 0;
        for (let i = 0; i < count; i++) {
          const r = Math.floor(Math.random() * sides) + 1;
          rolls.push(r);
          sum += r;
        }
        return { total: sum + modifier, rolls, modifier, formula, count, sides };
      } catch (err) {
        return { error: 'Invalid dice formula. Use format like 1d20+5 or 2d6' };
      }
    };

    // --- 3D ANIMATED DICE COMPONENT ---
    function ThreeDiceOverlay({ diceToRoll, onAnimationComplete }) {
      const mountRef = useRef(null);

      useEffect(() => {
        if (!diceToRoll) return;

        const container = mountRef.current;
        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 10, 15);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(width, height);
        container.appendChild(renderer.domElement);

        // Ambient and Directional Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x8b5cf6, 2, 50);
        pointLight.position.set(5, 10, 5);
        scene.add(pointLight);

        // Create 3D Geometry based on dice sides
        const diceMeshes = [];
        const count = Math.min(diceToRoll.rolls.length, 5);

        for (let i = 0; i < count; i++) {
          let geometry;
          const s = diceToRoll.sides;
          
          if (s === 20) {
            geometry = new THREE.IcosahedronGeometry(1.5);
          } else if (s === 12) {
            geometry = new THREE.DodecahedronGeometry(1.5);
          } else if (s === 10) {
            // D10 approximation
            geometry = new THREE.OctahedronGeometry(1.5);
            geometry.scale(1, 1.2, 1);
          } else if (s === 8) {
            geometry = new THREE.OctahedronGeometry(1.5);
          } else if (s === 6) {
            geometry = new THREE.BoxGeometry(2, 2, 2);
          } else if (s === 4) {
            geometry = new THREE.TetrahedronGeometry(1.5);
          } else {
            geometry = new THREE.BoxGeometry(2, 2, 2);
          }

          const material = new THREE.MeshStandardMaterial({
            color: 0x8b5cf6,
            roughness: 0.2,
            metalness: 0.8,
            wireframe: false
          });

          const mesh = new THREE.Mesh(geometry, material);
          mesh.position.set((i - (count - 1) / 2) * 3.5, 8, (Math.random() - 0.5) * 2);
          
          // Random angular velocities
          mesh.userData = {
            vx: (Math.random() - 0.5) * 0.2,
            vy: -0.2 - Math.random() * 0.1,
            rotX: Math.random() * 0.3,
            rotY: Math.random() * 0.3,
            rotZ: Math.random() * 0.3
          };

          scene.add(mesh);
          diceMeshes.push(mesh);
        }

        let frameId;
        let startTime = Date.now();

        const animate = () => {
          const elapsed = Date.now() - startTime;

          diceMeshes.forEach(mesh => {
            if (elapsed < 1200) {
              mesh.rotation.x += mesh.userData.rotX;
              mesh.rotation.y += mesh.userData.rotY;
              mesh.rotation.z += mesh.userData.rotZ;

              if (mesh.position.y > 0) {
                mesh.position.y += mesh.userData.vy;
              } else {
                mesh.position.y = 0; // Floor bounce
              }
            }
          });

          renderer.render(scene, camera);

          if (elapsed < 1600) {
            frameId = requestAnimationFrame(animate);
          } else {
            if (onAnimationComplete) onAnimationComplete();
          }
        };

        animate();

        return () => {
          cancelAnimationFrame(frameId);
          if (container && renderer.domElement) {
            container.removeChild(renderer.domElement);
          }
        };
      }, [diceToRoll]);

      if (!diceToRoll) return null;

      return (
        <div className="fixed inset-0 z-40 pointer-events-none flex items-center justify-center">
          <div ref={mountRef} className="w-full h-full max-w-3xl max-h-[500px]" />
        </div>
      );
    }

    // --- MAIN APPLICATION COMPONENT ---
    function GrimoireApp() {
      // --- APP & ROOM STATE ---
      const [roomId, setRoomId] = useState(() => {
        const hash = window.location.hash.replace('#', '');
        return hash || 'grimoire-room-' + Math.floor(1000 + Math.random() * 9000);
      });
      const [userRole, setUserRole] = useState('GM'); 
      const [userName, setUserName] = useState(() => 'Hero_' + Math.floor(Math.random() * 100));
      const [connectedPeers, setConnectedPeers] = useState([]);
      const [connectionStatus, setConnectionStatus] = useState('offline'); 
      const isPremium = true; // Hardcoded to Premium per requirements

      // --- CANVAS & CAMERA STATE ---
      const [camera, setCamera] = useState({ x: 0, y: 0, zoom: 1 });
      const [gridSize, setGridSize] = useState(50);
      const [gridOpacity, setGridOpacity] = useState(0.25);
      const [activeTool, setActiveTool] = useState('select'); 

      // --- PERSISTENT STATE LOGIC (Scenes, Assets, Tracks) ---
      const loadPersisted = (key, fallback) => {
        const saved = localStorage.getItem(`${key}_${roomId}`);
        return saved ? JSON.parse(saved) : fallback;
      };

      const [scenes, setScenes] = useState(() => loadPersisted('grim_scenes', DEFAULT_SCENES));
      const [activeSceneId, setActiveSceneId] = useState(() => scenes[0]?.id || 'scene-1');
      const activeScene = useMemo(() => scenes.find(s => s.id === activeSceneId) || scenes[0], [scenes, activeSceneId]);

      const [assets, setAssets] = useState(() => loadPersisted('grim_assets', INITIAL_SAMPLE_TOKENS));
      const [tracks, setTracks] = useState(() => loadPersisted('grim_tracks', []));
      
      useEffect(() => { localStorage.setItem(`grim_scenes_${roomId}`, JSON.stringify(scenes)); }, [scenes, roomId]);
      useEffect(() => { localStorage.setItem(`grim_assets_${roomId}`, JSON.stringify(assets)); }, [assets, roomId]);
      useEffect(() => { localStorage.setItem(`grim_tracks_${roomId}`, JSON.stringify(tracks)); }, [tracks, roomId]);

      // Tool Settings
      const [drawColor, setDrawColor] = useState('#8b5cf6');
      const [drawWidth, setDrawWidth] = useState(4);
      const [fogShape, setFogShape] = useState('rect'); // rect, circle, line, freehand
      const [measureStart, setMeasureStart] = useState(null);
      const [measureCurrent, setMeasureCurrent] = useState(null);

      // Selection & Context Menu
      const [selectedObjectId, setSelectedObjectId] = useState(null);
      const [contextMenu, setContextMenu] = useState(null);

      // UI Panels state
      const [showDicePanel, setShowDicePanel] = useState(false);
      const [showInitiativePanel, setShowInitiativePanel] = useState(false);
      const [showAssetPanel, setShowAssetPanel] = useState(false);
      const [showAudioPanel, setShowAudioPanel] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);

      // --- AUDIO & MUSIC STATE ---
      const [activeTrack, setActiveTrack] = useState(null);
      const [isPlayingAudio, setIsPlayingAudio] = useState(false);
      const [newTrackName, setNewTrackName] = useState('');
      const [newTrackUrl, setNewTrackUrl] = useState('');
      const audioRef = useRef(new Audio());

      // --- 3D DICE ANIMATION STATE ---
      const [active3DDice, setActive3DDice] = useState(null);

      const [chatMessages, setChatMessages] = useState([
        { id: '1', sender: 'System', text: 'Welcome to Grimoire VTT. Share your URL to invite players!', time: '12:00 PM' }
      ]);
      const [initiativeList, setInitiativeList] = useState([
        { id: 'i1', name: 'Valerius', score: 18, hp: 28, maxHp: 32 },
        { id: 'i2', name: 'Goblin Boss', score: 14, hp: 45, maxHp: 45 }
      ]);
      const [currentTurnIdx, setCurrentTurnIdx] = useState(0);

      // REFS
      const canvasRef = useRef(null);
      const peerRef = useRef(null);
      const connsRef = useRef({});
      const isDraggingRef = useRef(false);
      const dragStartRef = useRef({ x: 0, y: 0 });
      const currentDrawingRef = useRef(null);
      const currentFogRef = useRef(null);

      // --- WEBRTC MULTIPLAYER SYSTEM ---
      useEffect(() => {
        window.location.hash = roomId;
        const peer = new Peer(roomId + '-' + Math.random().toString(36).substring(2, 6));
        peerRef.current = peer;

        peer.on('open', (id) => {
          setConnectionStatus('connected');
        });

        peer.on('connection', (conn) => {
          conn.on('data', (data) => handlePeerData(data, conn));
          conn.on('open', () => {
            connsRef.current[conn.peer] = conn;
            setConnectedPeers(Object.keys(connsRef.current));
            if (userRole === 'GM') {
              conn.send({ type: 'SYNC_STATE', payload: { scenes, activeSceneId, initiativeList, tracks, activeTrack, isPlayingAudio } });
            }
          });
          conn.on('close', () => {
            delete connsRef.current[conn.peer];
            setConnectedPeers(Object.keys(connsRef.current));
          });
        });

        return () => {
          peer.destroy();
        };
      }, [roomId]);

      const broadcast = (data) => {
        Object.values(connsRef.current).forEach(conn => {
          if (conn.open) conn.send(data);
        });
      };

      const handlePeerData = (data, conn) => {
        switch (data.type) {
          case 'SYNC_STATE':
            setScenes(data.payload.scenes);
            setActiveSceneId(data.payload.activeSceneId);
            setInitiativeList(data.payload.initiativeList);
            if (data.payload.tracks) setTracks(data.payload.tracks);
            if (data.payload.activeTrack) playAudioTrack(data.payload.activeTrack, false);
            break;
          case 'UPDATE_TOKENS':
            updateActiveSceneTokens(data.payload, false);
            break;
          case 'ADD_DRAWING':
            addDrawingToActiveScene(data.payload, false);
            break;
          case 'UPDATE_FOG':
            updateFogInActiveScene(data.payload, false);
            break;
          case 'CHAT_MESSAGE':
            setChatMessages(prev => [...prev, data.payload]);
            break;
          case 'CHANGE_SCENE':
            setActiveSceneId(data.payload);
            break;
          case 'SYNC_AUDIO':
            if (data.payload.action === 'play') playAudioTrack(data.payload.track, false);
            else if (data.payload.action === 'stop') stopAudioTrack(false);
            break;
          default:
            break;
        }
      };

      // --- AUDIO & UPLOAD HANDLERS ---
      const playAudioTrack = (track, shouldBroadcast = true) => {
        setActiveTrack(track);
        setIsPlayingAudio(true);

        if (track.type === 'local') {
          audioRef.current.src = track.url;
          audioRef.current.loop = true;
          audioRef.current.play().catch(e => console.log('Audio autoplay prevented'));
        } else {
          // YT is handled via iframe below
          audioRef.current.pause();
        }

        if (shouldBroadcast) broadcast({ type: 'SYNC_AUDIO', payload: { action: 'play', track } });
      };

      const stopAudioTrack = (shouldBroadcast = true) => {
        setIsPlayingAudio(false);
        setActiveTrack(null);
        audioRef.current.pause();
        audioRef.current.currentTime = 0;
        if (shouldBroadcast) broadcast({ type: 'SYNC_AUDIO', payload: { action: 'stop' } });
      };

      const handleAudioUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const track = {
          id: generateId(),
          name: file.name,
          url: URL.createObjectURL(file),
          type: 'local'
        };
        setTracks(prev => [...prev, track]);
      };

      const handleAddYTTrack = () => {
        if (!newTrackName || !newTrackUrl) return;
        const track = { id: generateId(), name: newTrackName, url: newTrackUrl, type: 'youtube' };
        setTracks(prev => [...prev, track]);
        setNewTrackName('');
        setNewTrackUrl('');
      };

      const handleDeleteTrack = (id) => {
        if (activeTrack?.id === id) stopAudioTrack();
        setTracks(prev => prev.filter(t => t.id !== id));
      };

      const getYouTubeEmbedUrl = (url) => {
        try {
          let videoId = '';
          if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split('?')[0];
          else if (url.includes('youtube.com/watch')) {
            const urlParams = new URLSearchParams(new URL(url).search);
            videoId = urlParams.get('v');
          }
          return videoId ? `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1&loop=1&playlist=${videoId}` : url;
        } catch (e) {
          return url;
        }
      };

      // --- ASSET MANAGER HANDLERS ---
      const handleAssetUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const newAsset = {
          id: generateId(),
          name: file.name.split('.')[0],
          img: URL.createObjectURL(file),
          size: 60, hp: 20, maxHp: 20
        };
        setAssets(prev => [...prev, newAsset]);
      };

      const handleDeleteAsset = (e, id) => {
        e.stopPropagation();
        setAssets(prev => prev.filter(a => a.id !== id));
      };

      // --- SCENE HELPERS ---
      const updateActiveSceneTokens = (newTokens, shouldBroadcast = true) => {
        setScenes(prev => prev.map(s => s.id === activeSceneId ? { ...s, tokens: newTokens } : s));
        if (shouldBroadcast) broadcast({ type: 'UPDATE_TOKENS', payload: newTokens });
      };

      const addDrawingToActiveScene = (newDrawing, shouldBroadcast = true) => {
        setScenes(prev => prev.map(s => s.id === activeSceneId ? { ...s, drawings: [...s.drawings, newDrawing] } : s));
        if (shouldBroadcast) broadcast({ type: 'ADD_DRAWING', payload: newDrawing });
      };

      const updateFogInActiveScene = (newFog, shouldBroadcast = true) => {
        setScenes(prev => prev.map(s => s.id === activeSceneId ? { ...s, fogShapes: newFog } : s));
        if (shouldBroadcast) broadcast({ type: 'UPDATE_FOG', payload: newFog });
      };

      // --- CANVAS RENDERING ENGINE ---
      const renderCanvas = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const width = canvas.width = window.innerWidth;
        const height = canvas.height = window.innerHeight;

        ctx.clearRect(0, 0, width, height);
        ctx.save();
        ctx.translate(width / 2 + camera.x, height / 2 + camera.y);
        ctx.scale(camera.zoom, camera.zoom);

        // 1. Draw Map Background
        if (activeScene.mapImage) {
          ctx.drawImage(activeScene.mapImage, -activeScene.mapImage.width / 2, -activeScene.mapImage.height / 2);
        } else if (activeScene.mapUrl) {
          const img = new Image();
          img.src = activeScene.mapUrl;
          img.onload = () => { activeScene.mapImage = img; renderCanvas(); };
        }

        // 2. Draw Grid Lines
        ctx.strokeStyle = `rgba(255, 255, 255, ${gridOpacity})`;
        ctx.lineWidth = 1 / camera.zoom;
        const bound = 3000;
        ctx.beginPath();
        for (let x = -bound; x <= bound; x += gridSize) { ctx.moveTo(x, -bound); ctx.lineTo(x, bound); }
        for (let y = -bound; y <= bound; y += gridSize) { ctx.moveTo(-bound, y); ctx.lineTo(bound, y); }
        ctx.stroke();

        // 3. Draw Vector Drawings
        (activeScene.drawings || []).forEach(d => {
          ctx.strokeStyle = d.color;
          ctx.lineWidth = d.width;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          d.points.forEach((pt, idx) => {
            if (idx === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          });
          ctx.stroke();
        });

        if (currentDrawingRef.current) {
          const cd = currentDrawingRef.current;
          ctx.strokeStyle = cd.color;
          ctx.lineWidth = cd.width;
          ctx.beginPath();
          cd.points.forEach((pt, idx) => {
            if (idx === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          });
          ctx.stroke();
        }

        // 4. Draw Measurement Vector
        if (measureStart && measureCurrent) {
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 3 / camera.zoom;
          ctx.setLineDash([8, 8]);
          ctx.beginPath();
          ctx.moveTo(measureStart.x, measureStart.y);
          ctx.lineTo(measureCurrent.x, measureCurrent.y);
          ctx.stroke();
          ctx.setLineDash([]);
          const distPx = Math.hypot(measureCurrent.x - measureStart.x, measureCurrent.y - measureStart.y);
          const feet = Math.round((distPx / gridSize) * 5);
          ctx.fillStyle = '#f59e0b';
          ctx.font = 'bold 16px Inter, sans-serif';
          ctx.fillText(`${feet} ft`, measureCurrent.x + 15, measureCurrent.y - 15);
        }

        // 5. Draw Tokens
        (activeScene.tokens || []).forEach(token => {
          if (token.hidden && userRole !== 'GM') return;
          ctx.save();
          ctx.translate(token.x, token.y);
          if (selectedObjectId === token.id) {
            ctx.strokeStyle = '#8b5cf6';
            ctx.lineWidth = 4 / camera.zoom;
            ctx.beginPath();
            ctx.arc(0, 0, token.size / 2 + 6, 0, Math.PI * 2);
            ctx.stroke();
          }
          if (token.hidden && userRole === 'GM') ctx.globalAlpha = 0.5;
          ctx.beginPath();
          ctx.arc(0, 0, token.size / 2, 0, Math.PI * 2);
          ctx.clip();

          if (token.imgObj) {
            ctx.drawImage(token.imgObj, -token.size / 2, -token.size / 2, token.size, token.size);
          } else if (token.img) {
            const img = new Image();
            img.src = token.img;
            img.onload = () => { token.imgObj = img; renderCanvas(); };
            ctx.fillStyle = '#3f455a';
            ctx.fillRect(-token.size / 2, -token.size / 2, token.size, token.size);
          }
          ctx.restore();

          if (token.maxHp) {
            const barW = token.size, barH = 6, hpRatio = Math.max(0, Math.min(1, token.hp / token.maxHp));
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(token.x - barW / 2, token.y + token.size / 2 + 4, barW, barH);
            ctx.fillStyle = hpRatio > 0.5 ? '#10b981' : hpRatio > 0.2 ? '#f59e0b' : '#ef4444';
            ctx.fillRect(token.x - barW / 2, token.y + token.size / 2 + 4, barW * hpRatio, barH);
          }
          ctx.fillStyle = '#ffffff';
          ctx.font = '12px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(token.name, token.x, token.y + token.size / 2 + 22);
        });

        // 6. Fog of War Layer (GM sees semi-transparent, Players see pitch black)
        const drawFogShape = (fog) => {
          if (!fog.points || fog.points.length === 0) return;
          const start = fog.points[0];
          
          if (fog.type === 'circle' && fog.end) {
            const r = Math.hypot(fog.end.x - start.x, fog.end.y - start.y);
            ctx.beginPath();
            ctx.arc(start.x, start.y, r, 0, Math.PI * 2);
            ctx.fill();
          } else if (fog.type === 'rect' && fog.end) {
            ctx.fillRect(start.x, start.y, fog.end.x - start.x, fog.end.y - start.y);
          } else if (fog.type === 'line' && fog.end) {
            ctx.beginPath();
            ctx.moveTo(start.x, start.y);
            ctx.lineTo(fog.end.x, fog.end.y);
            ctx.lineWidth = 40; // Thick line for fog wall
            ctx.stroke();
          } else if (fog.type === 'freehand') {
            ctx.beginPath();
            fog.points.forEach((pt, idx) => {
              if(idx===0) ctx.moveTo(pt.x, pt.y);
              else ctx.lineTo(pt.x, pt.y);
            });
            ctx.fill();
          }
        };

        if ((activeScene.fogShapes && activeScene.fogShapes.length > 0) || currentFogRef.current) {
          ctx.save();
          ctx.fillStyle = userRole === 'GM' ? 'rgba(10, 11, 14, 0.65)' : 'rgba(10, 11, 14, 0.98)';
          ctx.strokeStyle = userRole === 'GM' ? 'rgba(10, 11, 14, 0.65)' : 'rgba(10, 11, 14, 0.98)';
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          
          (activeScene.fogShapes || []).forEach(drawFogShape);
          if (currentFogRef.current) drawFogShape(currentFogRef.current);
          
          ctx.restore();
        }

        ctx.restore();
      }, [camera, activeScene, gridSize, gridOpacity, measureStart, measureCurrent, selectedObjectId, userRole]);

      useEffect(() => { renderCanvas(); }, [renderCanvas]);

      useEffect(() => {
        const handleResize = () => renderCanvas();
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, [renderCanvas]);

      const screenToCanvas = (screenX, screenY) => {
        const canvas = canvasRef.current;
        const x = (screenX - canvas.width / 2 - camera.x) / camera.zoom;
        const y = (screenY - canvas.height / 2 - camera.y) / camera.zoom;
        return { x, y };
      };

      const handleMouseDown = (e) => {
        if (e.button === 2) return;
        const coords = screenToCanvas(e.clientX, e.clientY);
        setContextMenu(null);

        if (activeTool === 'select') {
          const clickedToken = [...(activeScene.tokens || [])].reverse().find(t => Math.hypot(t.x - coords.x, t.y - coords.y) <= t.size / 2);
          if (clickedToken) {
            setSelectedObjectId(clickedToken.id);
            isDraggingRef.current = true;
            dragStartRef.current = { x: coords.x - clickedToken.x, y: coords.y - clickedToken.y };
          } else {
            setSelectedObjectId(null);
            isDraggingRef.current = true;
            dragStartRef.current = { x: e.clientX - camera.x, y: e.clientY - camera.y };
          }
        } else if (activeTool === 'draw') {
          isDraggingRef.current = true;
          currentDrawingRef.current = { type: 'freehand', color: drawColor, width: drawWidth, points: [coords] };
        } else if (activeTool === 'measure') {
          setMeasureStart(coords);
          setMeasureCurrent(coords);
          isDraggingRef.current = true;
        } else if (activeTool === 'fog' && userRole === 'GM') {
          isDraggingRef.current = true;
          currentFogRef.current = { id: generateId(), type: fogShape, points: [coords], end: coords };
        } else if (activeTool === 'eraser') {
          const remainingDrawings = (activeScene.drawings || []).filter(d => {
            if (!d.points || d.points.length === 0) return true;
            return Math.hypot(d.points[0].x - coords.x, d.points[0].y - coords.y) > 30;
          });
          const remainingFog = (activeScene.fogShapes || []).filter(f => {
            if (!f.points || f.points.length === 0) return true;
            return Math.hypot(f.points[0].x - coords.x, f.points[0].y - coords.y) > 40;
          });
          setScenes(prev => prev.map(s => s.id === activeSceneId ? { ...s, drawings: remainingDrawings, fogShapes: remainingFog } : s));
        }
      };

      const handleMouseMove = (e) => {
        const coords = screenToCanvas(e.clientX, e.clientY);
        if (isDraggingRef.current) {
          if (activeTool === 'select') {
            if (selectedObjectId) {
              const updated = (activeScene.tokens || []).map(t => {
                if (t.id === selectedObjectId) {
                  let newX = coords.x - dragStartRef.current.x, newY = coords.y - dragStartRef.current.y;
                  newX = Math.round(newX / gridSize) * gridSize; newY = Math.round(newY / gridSize) * gridSize;
                  return { ...t, x: newX, y: newY };
                }
                return t;
              });
              updateActiveSceneTokens(updated);
            } else {
              setCamera(prev => ({ ...prev, x: e.clientX - dragStartRef.current.x, y: e.clientY - dragStartRef.current.y }));
            }
          } else if (activeTool === 'draw' && currentDrawingRef.current) {
            currentDrawingRef.current.points.push(coords);
            renderCanvas();
          } else if (activeTool === 'measure') {
            setMeasureCurrent(coords);
            renderCanvas();
          } else if (activeTool === 'fog' && currentFogRef.current) {
            if (fogShape === 'freehand') {
              currentFogRef.current.points.push(coords);
            } else {
              currentFogRef.current.end = coords;
            }
            renderCanvas();
          }
        }
      };

      const handleMouseUp = () => {
        if (isDraggingRef.current) {
          if (activeTool === 'draw' && currentDrawingRef.current) {
            addDrawingToActiveScene(currentDrawingRef.current);
            currentDrawingRef.current = null;
          } else if (activeTool === 'fog' && currentFogRef.current) {
            updateFogInActiveScene([...(activeScene.fogShapes || []), currentFogRef.current]);
            currentFogRef.current = null;
          }
        }
        isDraggingRef.current = false;
        setMeasureStart(null);
        setMeasureCurrent(null);
      };

      const handleWheel = (e) => {
        e.preventDefault();
        setCamera(prev => ({ ...prev, zoom: Math.min(Math.max(0.2, prev.zoom * (e.deltaY < 0 ? 1.1 : 0.9)), 4.0) }));
      };

      const handleContextMenu = (e) => {
        e.preventDefault();
        const coords = screenToCanvas(e.clientX, e.clientY);
        const clickedToken = [...(activeScene.tokens || [])].reverse().find(t => Math.hypot(t.x - coords.x, t.y - coords.y) <= t.size / 2);
        setContextMenu({ x: e.clientX, y: e.clientY, targetToken: clickedToken || null, canvasCoords: coords });
      };

      const handleRollDice = (formula) => {
        const result = rollDiceFormula(formula);
        if (result.error) return;
        setActive3DDice(result);
        const newMsg = { id: generateId(), sender: userName, text: `rolled ${formula}: [${result.rolls.join(', ')}] = ${result.total}`, isRoll: true, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
        setChatMessages(prev => [...prev, newMsg]);
        broadcast({ type: 'CHAT_MESSAGE', payload: newMsg });
        if (window.confetti && result.rolls.some(r => r === 20 && result.sides === 20)) window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      };

      const handleRoomChange = () => {
        const target = prompt("Enter Room ID to jump to:", roomId);
        if (target && target !== roomId) {
          window.location.hash = target;
          window.location.reload();
        }

      return (
        <div className="relative w-screen h-screen overflow-hidden bg-grim-900 text-slate-100 flex flex-col">

          {activeTrack && activeTrack.type === 'youtube' && isPlayingAudio && (
            <div className="hidden">
              <iframe 
                width="1" 
                height="1" 
                src={getYouTubeEmbedUrl(activeTrack.url)} 
                title="Audio Stream" 
                allow="autoplay; encrypted-media"
              />
            </div>
          )}

          {/* --- TOP HEADER BAR --- */}
          <header className="absolute top-0 left-0 right-0 h-14 z-20 glass-panel flex items-center justify-between px-4 border-b border-white/10">
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2 font-mono font-bold text-lg text-grim-accent tracking-wider">
                <i data-lucide="book-open" className="w-6 h-6 text-grim-accent"></i>
                <span>GRIMOIRE<span className="text-xs text-grim-gold font-sans ml-1 uppercase border border-grim-gold/30 px-1.5 py-0.5 rounded">VTT</span></span>
              </div>
              <div className="h-4 w-[1px] bg-slate-700"></div>
              <span onClick={handleRoomChange} className="text-xs text-slate-400 font-mono cursor-pointer hover:text-white transition" title="Click to change room">

              <span className={`inline-flex items-center gap-1.5 text-xs px-2 py-0.5 rounded-full ${connectionStatus === 'connected' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400'}`}>
                <span className={`w-2 h-2 rounded-full ${connectionStatus === 'connected' ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>

            <div className="flex items-center gap-2 glass-button px-3 py-1 rounded-lg">

          {activeTool === 'draw' && (

          {activeTool === 'fog' && userRole === 'GM' && (
            <div className="absolute top-20 left-20 z-20 glass-panel p-2 rounded-xl flex items-center gap-2 animate-fade-in">

                { shape: 'freehand', icon: 'pen-tool', label: 'Freehand Fill' }
              ].map(opt => (
                <button 
                  key={opt.shape} 
                  onClick={() => setFogShape(opt.shape)} 
                  title={opt.label}
                  className={`p-1.5 rounded ${fogShape === opt.shape ? 'bg-grim-accent/40 text-white' : 'text-slate-400 hover:text-white'}`}

                  <i data-lucide={opt.icon} className="w-4 h-4"></i>

            </div>

          {/* --- CANVAS AREA --- */}
          <main className="flex-1 w-full h-full relative cursor-crosshair">
            <canvas ref={canvasRef} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onWheel={handleWheel} onContextMenu={handleContextMenu} className="w-full h-full block" />
          </main>

          {/* --- CONTEXT MENU --- */}
          {contextMenu && (
            <div style={{ top: contextMenu.y, left: contextMenu.x }} className="absolute z-50 glass-panel rounded-xl shadow-2xl p-2 min-w-[160px] flex flex-col gap-1 border border-white/10">
              {contextMenu.targetToken ? (
                <>
                  <div className="px-2 py-1 text-xs font-bold text-slate-400 uppercase border-b border-white/5">{contextMenu.targetToken.name}</div>
                  {userRole === 'GM' && (
                    <button onClick={() => { updateActiveSceneTokens(activeScene.tokens.map(t => t.id === contextMenu.targetToken.id ? { ...t, hidden: !t.hidden } : t)); setContextMenu(null); }} className="text-left px-2 py-1.5 text-xs hover:bg-grim-accent/20 rounded text-slate-200 flex items-center gap-2">
                      <i data-lucide={contextMenu.targetToken.hidden ? "eye" : "eye-off"} className="w-3.5 h-3.5"></i>
                      {contextMenu.targetToken.hidden ? 'Reveal Token' : 'Hide Token'}
                    </button>
                  )}
                  <button onClick={() => { updateActiveSceneTokens(activeScene.tokens.filter(t => t.id !== contextMenu.targetToken.id)); setContextMenu(null); }} className="text-left px-2 py-1.5 text-xs hover:bg-red-500/20 text-red-400 rounded flex items-center gap-2">
                    <i data-lucide="trash-2" className="w-3.5 h-3.5"></i> Delete Token
                  </button>
                </>
              ) : (
                <>
                  <div className="px-2 py-1 text-xs font-bold text-slate-400 uppercase border-b border-white/5">Canvas Options</div>
                  <button onClick={() => { setCamera({ x: 0, y: 0, zoom: 1 }); setContextMenu(null); }} className="text-left px-2 py-1.5 text-xs hover:bg-grim-accent/20 rounded text-slate-200 flex items-center gap-2">
                    <i data-lucide="locate" className="w-3.5 h-3.5"></i> Reset Camera
                  </button>
                </>
              )}
            </div>
          )}

          {/* --- BOTTOM DOCK / CONTROLS --- */}
          <footer className="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 glass-panel px-4 py-2 rounded-2xl flex items-center gap-4 shadow-2xl border border-white/10">
            <button onClick={() => setShowAssetPanel(!showAssetPanel)} className="glass-button px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
              <i data-lucide="folder" className="w-4 h-4 text-grim-accent"></i> Assets
            </button>
            <button onClick={() => setShowInitiativePanel(!showInitiativePanel)} className="glass-button px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
              <i data-lucide="swords" className="w-4 h-4 text-grim-gold"></i> Initiative
            </button>
            <button onClick={() => setShowAudioPanel(!showAudioPanel)} className="glass-button px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
              <i data-lucide="music" className="w-4 h-4 text-cyan-400"></i> Audio & Music
            </button>
            <button onClick={() => setShowDicePanel(!showDicePanel)} className="glass-button px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
              <i data-lucide="dices" className="w-4 h-4 text-emerald-400"></i> Dice & Chat
            </button>
          </footer>

          {/* --- MUSIC & AUDIO PLAYER PANEL --- */}
          {showAudioPanel && (
            <div className="absolute bottom-20 left-1/2 -translate-x-1/2 z-30 glass-panel w-[420px] rounded-2xl p-4 flex flex-col shadow-2xl border border-white/10 animate-fade-in">
              <div className="flex justify-between items-center mb-3">
                <h3 className="font-bold text-sm text-slate-200 flex items-center gap-2">
                  <i data-lucide="music" className="w-4 h-4 text-cyan-400"></i> Ambient Music & Audio
                </h3>
                <button onClick={() => setShowAudioPanel(false)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-4 h-4"></i></button>
              </div>

              <div className="bg-grim-900/60 p-2.5 rounded-xl border border-white/5 mb-3 flex items-center justify-between">
                <div className="flex items-center gap-2 overflow-hidden">
                  <span className={`w-2 h-2 rounded-full ${isPlayingAudio ? 'bg-cyan-400 animate-ping' : 'bg-slate-600'}`}></span>
                  <span className="text-xs font-medium text-slate-200 truncate">
                    {isPlayingAudio ? `Playing: ${activeTrack?.name}` : 'Audio Idle'}
                  </span>
                </div>
                {isPlayingAudio && (
                  <button onClick={() => stopAudioTrack()} className="text-xs px-2 py-1 bg-red-500/20 text-red-400 rounded hover:bg-red-500/30">Stop</button>
                )}
              </div>

              <div className="space-y-1.5 max-h-40 overflow-y-auto mb-3">
                {tracks.map(track => (
                  <div key={track.id} className="flex items-center justify-between p-2 rounded-lg bg-grim-800/50 border border-white/5 text-xs">
                    <div className="flex items-center gap-2">
                      <i data-lucide={track.type === 'youtube' ? "youtube" : "file-audio"} className={`w-4 h-4 ${track.type === 'youtube' ? 'text-red-400' : 'text-cyan-400'}`}></i>
                      <span className="text-slate-200 font-medium truncate w-40">{track.name}</span>
                    </div>
                    <div className="flex items-center gap-1">
                      <button onClick={() => playAudioTrack(track)} className="px-2.5 py-1 bg-cyan-500/20 text-cyan-300 rounded hover:bg-cyan-500/40">Play</button>
                      <button onClick={() => handleDeleteTrack(track.id)} className="px-2 py-1 bg-red-500/10 text-red-400 hover:text-red-300 rounded"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></button>
                    </div>
                  </div>
                ))}
              </div>

              <div className="border-t border-white/10 pt-3 space-y-2">
                <span className="text-[11px] text-slate-400 block font-semibold">Add Track</span>
                <div className="flex gap-2">
                  <input type="text" placeholder="Track Name" value={newTrackName} onChange={e => setNewTrackName(e.target.value)} className="w-1/3 bg-grim-900 border border-white/10 text-xs text-slate-200 rounded px-2 py-1 focus:outline-none" />
                  <input type="text" placeholder="YT URL" value={newTrackUrl} onChange={e => setNewTrackUrl(e.target.value)} className="flex-1 bg-grim-900 border border-white/10 text-xs text-slate-200 rounded px-2 py-1 focus:outline-none" />
                  <button onClick={handleAddYTTrack} className="bg-red-500/20 text-red-300 px-3 py-1 text-xs rounded hover:bg-red-500/40 font-bold">Add YT</button>
                </div>
                <div className="flex items-center gap-2 mt-2">
                  <label className="text-[11px] font-semibold text-slate-400 flex-shrink-0">Upload Audio:</label>
                  <input type="file" accept="audio/*" onChange={handleAudioUpload} className="w-full text-xs text-slate-300 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-cyan-500/20 file:text-cyan-300 hover:file:bg-cyan-500/30 cursor-pointer" />
                </div>
              </div>
            </div>
          )}

          {/* --- ASSETS & TOKENS DRAWER --- */}
          {showAssetPanel && (
            <div className="absolute bottom-20 left-1/2 -translate-x-1/2 z-30 glass-panel w-[500px] h-72 rounded-2xl p-4 flex flex-col shadow-2xl border border-white/10 animate-fade-in">
              <div className="flex justify-between items-center mb-3">
                <h3 className="font-bold text-sm text-slate-200 flex items-center gap-2">
                  <i data-lucide="folder" className="w-4 h-4 text-grim-accent"></i> Token & Map Library
                </h3>
                <div className="flex items-center gap-3">
                  <label className="cursor-pointer bg-grim-accent/20 hover:bg-grim-accent/40 text-grim-accent px-3 py-1 rounded text-xs font-semibold flex items-center gap-1.5 transition">
                    <i data-lucide="upload" className="w-3.5 h-3.5"></i> Upload Image
                    <input type="file" accept="image/*" onChange={handleAssetUpload} className="hidden" />
                  </label>
                  <button onClick={() => setShowAssetPanel(false)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-4 h-4"></i></button>
                </div>
              </div>
              <div className="grid grid-cols-4 gap-3 overflow-y-auto flex-1 pr-1">
                {assets.map(tok => (
                  <div key={tok.id} onClick={() => updateActiveSceneTokens([...activeScene.tokens, { ...tok, id: generateId(), x: -camera.x, y: -camera.y }])} className="relative flex flex-col items-center p-2 rounded-xl glass-button cursor-pointer group">
                    <button onClick={(e) => handleDeleteAsset(e, tok.id)} className="absolute top-1 right-1 p-1 bg-red-500/80 text-white rounded-full opacity-0 group-hover:opacity-100 transition z-10"><i data-lucide="x" className="w-3 h-3"></i></button>
                    <img src={tok.img} alt={tok.name} className="w-12 h-12 rounded-full object-cover group-hover:scale-105 transition" />
                    <span className="text-[10px] text-center mt-1 text-slate-300 truncate w-full">{tok.name}</span>
                  </div>
                ))}
              </div>

          {/* --- INITIATIVE TRACKER PANEL --- */}
          {showInitiativePanel && (
            <div className="absolute top-20 right-4 z-20 glass-panel w-72 rounded-2xl p-4 shadow-2xl border border-white/10 animate-fade-in">
              <div className="flex justify-between items-center mb-3">
                <h3 className="font-bold text-sm text-slate-200 flex items-center gap-2">
                  <i data-lucide="swords" className="w-4 h-4 text-grim-gold"></i> Initiative
                </h3>
                <button onClick={() => setShowInitiativePanel(false)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-4 h-4"></i></button>
              </div>
              <div className="space-y-2 mb-3 max-h-48 overflow-y-auto">
                {initiativeList.map((item, idx) => (
                  <div key={item.id} className={`p-2 rounded-lg flex items-center justify-between border ${idx === currentTurnIdx ? 'bg-grim-accent/20 border-grim-accent' : 'bg-grim-800/50 border-white/5'}`}>
                    <span className="text-xs font-semibold text-slate-200">{item.name}</span>
                    <span className="text-xs font-mono bg-grim-700 px-2 py-0.5 rounded text-grim-gold">{item.score}</span>
                  </div>
                ))}
              </div>
              <button onClick={() => setCurrentTurnIdx((currentTurnIdx + 1) % Math.max(1, initiativeList.length))} className="w-full py-1.5 bg-grim-accent hover:bg-grim-accent/80 text-white font-medium text-xs rounded-lg transition">
                Next Turn
              </button>
            </div>

          {/* --- DICE & CHAT PANEL --- */}
          {showDicePanel && (
            <div className="absolute bottom-20 right-4 z-20 glass-panel w-80 h-96 rounded-2xl p-4 flex flex-col shadow-2xl border border-white/10 animate-fade-in">
              <div className="flex justify-between items-center mb-2">
                <h3 className="font-bold text-sm text-slate-200 flex items-center gap-2">
                  <i data-lucide="message-square" className="w-4 h-4 text-emerald-400"></i> Log & Dice
                </h3>
                <button onClick={() => setShowDicePanel(false)} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-4 h-4"></i></button>
              </div>

              <div className="grid grid-cols-4 gap-1.5 mb-2">
                {['1d20', '1d12', '1d10', '1d8', '1d6', '1d4', '2d6+3', '1d20+5'].map(formula => (
                  <button key={formula} onClick={() => handleRollDice(formula)} className="glass-button py-1 text-[11px] font-mono text-slate-300 rounded">
                    {formula}
                  </button>
                ))}
              </div>

              <div className="flex-1 overflow-y-auto bg-grim-900/60 p-2 rounded-lg border border-white/5 space-y-2 mb-2">
                {chatMessages.map(msg => (
                  <div key={msg.id} className="text-xs">
                    <span className="font-bold text-grim-accent">{msg.sender}: </span>
                    <span className={msg.isRoll ? "font-mono text-grim-gold font-semibold" : "text-slate-300"}>{msg.text}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* --- SETTINGS MODAL --- */}
          {showSettingsModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="glass-panel w-full max-w-md rounded-3xl p-6 border border-white/10 shadow-2xl relative">
                <button onClick={() => setShowSettingsModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
                <h3 className="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">
                  <i data-lucide="settings" className="w-5 h-5 text-grim-accent"></i> App Settings
                </h3>

                <div className="space-y-4">
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Grid Opacity</label>
                    <input type="range" min="0" max="1" step="0.05" value={gridOpacity} onChange={e => setGridOpacity(Number(e.target.value))} className="w-full accent-grim-accent" />
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GrimoireApp />);
  </script>
</body>
</html>
